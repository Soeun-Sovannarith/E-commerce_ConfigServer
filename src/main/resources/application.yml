spring:
  application.name: config-server
  profiles.active: ${CONFIG_PROFILE:native}
  cloud.config.server:
    native.search-locations: classpath:/config
    git:
      uri: ${CONFIG_GIT_URI:https://github.com/example/commerce-config.git}
      default-label: ${CONFIG_GIT_BRANCH:main}
      clone-on-start: true
server.port: ${SERVER_PORT:8888}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      management.context-path: /actuator
management.endpoints.web.exposure.include: health,info,prometheus
