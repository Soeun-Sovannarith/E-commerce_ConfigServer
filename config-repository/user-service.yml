server.port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/commerce}
    jwk-set-uri: ${JWT_JWK_SET_URI:${JWT_ISSUER_URI:http://localhost:8180/realms/commerce}/protocol/openid-connect/certs}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
